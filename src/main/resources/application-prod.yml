spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    root: WARN
    com.example: INFO